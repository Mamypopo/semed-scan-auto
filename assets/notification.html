<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', 'Sarabun', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    padding: 6px 8px 6px 6px;
    height: 100%;
    display: flex;
    align-items: stretch;
  }
  .card {
    flex: 1;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.16), 0 2px 8px rgba(0,0,0,0.08);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    position: relative;
    overflow: hidden;
    animation: slideIn 0.28s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes slideIn {
    from { transform: translateX(115%); opacity: 0; }
    to   { transform: translateX(0);    opacity: 1; }
  }
  .accent {
    width: 3px;
    align-self: stretch;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .content { flex: 1; min-width: 0; }
  .title {
    font-size: 12.5px;
    font-weight: 700;
    color: #09090b;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .body {
    font-size: 11px;
    color: #71717a;
    margin-top: 2px;
    line-height: 1.5;
  }
  .progress {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 0 0 14px 14px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 100%;
    animation: shrink 5s linear forwards;
  }
  @keyframes shrink {
    from { width: 100%; }
    to   { width: 0%;   }
  }

  .success .accent        { background: #22c55e; }
  .success .icon          { background: #dcfce7; }
  .success .progress-fill { background: #22c55e; }

  .error .accent          { background: #ef4444; }
  .error .icon            { background: #fee2e2; }
  .error .progress-fill   { background: #ef4444; }

  .warning .accent        { background: #f59e0b; }
  .warning .icon          { background: #fef3c7; }
  .warning .progress-fill { background: #f59e0b; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <div class="accent"></div>
    <div class="icon" id="icon"></div>
    <div class="content">
      <div class="title" id="titleEl"></div>
      <div class="body"  id="bodyEl"></div>
    </div>
    <div class="progress"><div class="progress-fill"></div></div>
  </div>
</div>
<script>
  const p = new URLSearchParams(location.search)
  const type  = p.get('type')  || 'success'
  const title = p.get('title') || ''
  const body  = p.get('body')  || ''

  document.getElementById('card').classList.add(type)

  const icons = { success: '✅', error: '❌', warning: '🔁' }
  document.getElementById('icon').textContent = icons[type] || '📢'
  document.getElementById('titleEl').textContent = title

  const bodyEl = document.getElementById('bodyEl')
  if (body) {
    body.split('\n').forEach((line, i) => {
      if (i > 0) bodyEl.appendChild(document.createElement('br'))
      bodyEl.appendChild(document.createTextNode(line))
    })
  } else {
    bodyEl.style.display = 'none'
  }
</script>
</body>
</html>
